name: Chapters Content Sync

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Scheduled Bulk Catalog Sync"]
    types:
      - completed

jobs:
  seed-chapters:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pagelight
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Populate real chapters
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CHAPTER_LIMIT_PER_FORMAT: "100"
        run: |
          if [ -f package.json ]; then
            npm install
          else
            npm install --no-save @supabase/supabase-js
          fi
          node scripts/seed-chapters.mjs
